<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GitXDC</title>
  <link rel="stylesheet" href="style.css" />
  <!-- webxdc.js es inyectado por el cliente; el polyfill se usa solo en desarrollo -->
  <script src="webxdc.js"></script>
</head>
<body>
  <div id="app">
    <header>
      <div class="logo">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
        </svg>
        <span>GitXDC</span>
      </div>
      <span class="repo-name" id="repo-name">—</span>
      <div class="spacer"></div>
      <span class="status" id="status">inicializando…</span>
      <button id="btn-sync" title="Sincronizar packfiles P2P">Sync</button>
      <button id="btn-commit" class="primary" title="Crear commit">Commit</button>
      <button id="btn-export" title="Exportar .xdc">Export</button>
    </header>

    <nav class="tabs">
      <div class="tab active" data-tab="code">Código</div>
      <div class="tab" data-tab="issues">Issues <span class="badge" id="badge-issues">0</span></div>
      <div class="tab" data-tab="prs">PRs <span class="badge" id="badge-prs">0</span></div>
      <div class="tab" data-tab="log">Log</div>
    </nav>

    <main>
      <!-- Panel Código -->
      <div class="panel active" id="panel-code">
        <div class="file-tree" id="file-tree">
          <div class="empty"><h3>Sin repositorio</h3><p>Crea o clona un repo</p></div>
        </div>
        <div class="editor-area">
          <div class="editor-toolbar">
            <span class="path" id="editor-path">Selecciona un archivo</span>
            <button id="btn-save" disabled>Guardar</button>
            <button id="btn-new-file">Nuevo</button>
          </div>
          <div id="editor-container"></div>
        </div>
      </div>

      <!-- Panel Issues -->
      <div class="panel" id="panel-issues">
        <div class="list-panel" id="issues-list">
          <div class="list-header">
            <h2>Issues</h2>
            <button id="btn-new-issue">Nuevo Issue</button>
          </div>
          <div id="issues-container"></div>
        </div>
        <div class="detail-view" id="issue-detail" style="display:none"></div>
      </div>

      <!-- Panel PRs -->
      <div class="panel" id="panel-prs">
        <div class="list-panel" id="prs-list">
          <div class="list-header">
            <h2>Pull Requests</h2>
            <button id="btn-new-pr">Nuevo PR</button>
          </div>
          <div id="prs-container"></div>
        </div>
        <div class="detail-view" id="pr-detail" style="display:none"></div>
      </div>

      <!-- Panel Log -->
      <div class="panel" id="panel-log">
        <div id="log-container"></div>
      </div>
    </main>
  </div>

  <!-- Vendor bundles (generados por vendor.sh) -->
  <script src="vendor/isomorphic-git.js"></script>
  <script src="vendor/lightning-fs.js"></script>
  <script src="vendor/yjs.js"></script>
  <script src="vendor/codemirror.js"></script>
  <!-- App -->
  <script src="editor.js"></script>
  <script src="app.js"></script>
</body>
</html>
